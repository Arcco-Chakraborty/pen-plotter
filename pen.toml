# vpype-gcode profile for the servo pen plotter.
#
#   vpype --config pen.toml read drawing.svg \
#         linemerge linesort reloop linesimplify \
#         gwrite --profile pen out.gcode
#
# This machine has NO Z motor. The pen is driven entirely by the servo through
# grbl's spindle PWM, so this profile emits zero Z words - any G0/G1 Z here would
# command a phantom axis and stall the planner waiting on motion that never happens.

[gwrite.pen]
unit = "mm"
invert_y = true          # SVG origin is top-left, G-code origin is bottom-left

# ---- TUNE THESE TWO ----------------------------------------------------------
# Find them with:  .\pen-tune.ps1
# S0 = 1.0 ms pulse, S500 = 1.5 ms, S1000 = 2.0 ms.
# PEN UP   -> S400    PEN DOWN -> S1000
# Give the servo ~0.25 s (G4 P0.25) to actually travel; grbl syncs the planner on
# a spindle change but does not wait for the servo arm to arrive.
# ------------------------------------------------------------------------------

document_start = """G21
G90
G17
F3000
M3 S400
G4 P0.3
"""

# Pen is already up here (document_start or the previous line_end raised it).
# Rapid to the start of the path, then drop.
segment_first = """G0 X{x:.3f} Y{y:.3f}
M3 S1000
G4 P0.25
"""

segment = "G1 X{x:.3f} Y{y:.3f}\n"

# Raise at the end of every path. Lifting can be a touch quicker than landing -
# a late landing drags a line, a late lift only costs time.
line_end = """M3 S400
G4 P0.15
"""

# M5 parks the servo at the pen-up pulse (see PEN_PLOTTER_SERVO in config.h) rather
# than cutting the PWM frame and letting the arm go limp.
document_end = """M5
G0 X0.000 Y0.000
M2
"""
